name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1.3.0
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: |
          Thank you for opening your first issue in this repository.
          
          To help us address it efficiently, please make sure your description includes:
          - What you expected to happen
          - What actually happened
          - Steps to reproduce the problem
          - Relevant logs, screenshots, or error messages (if any)
          
          You can find more information about how to contribute and report issues in our contributing guidelines (see CONTRIBUTING.md) and any issue templates available in the repository.
        pr-message: |
          Thank you for submitting your first pull request to this repository.
          
          A maintainer will review your changes as soon as possible. In the meantime, please ensure that:
          - The pull request description clearly explains the motivation and what was changed
          - Related issues are linked, if applicable (for example, "Fixes #123")
          - Tests have been added or updated, and all checks are passing
          
          For more details on our workflow and coding standards, please review our contributing guidelines (CONTRIBUTING.md) and any other documentation in this repository.
