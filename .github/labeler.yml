# Configuration for the labeler action
# Automatically labels pull requests based on the files changed

workflows:
  - '.github/workflows/**/*'
components:
  - 'src/components/**/*'
ui:
  - 'src/components/ui/**/*'
backgrounds:
  - 'src/components/backgrounds/**/*'
pages:
  - 'src/pages/**/*'
hooks:
  - 'src/hooks/**/*'
lib:
  - 'src/lib/**/*'
data:
  - 'src/data/**/*'
zones:
  - 'src/zones/**/*'
tests:
  - 'src/test/**/*'
  - '**/*.test.ts'
  - '**/*.test.tsx'
  - '**/*.spec.ts'
  - '**/*.spec.tsx'
  - 'vitest.config.ts'
styles:
  - '**/*.css'
  - 'tailwind.config.ts'
  - 'postcss.config.js'
config:
  - '*.config.js'
  - '*.config.ts'
  - 'tsconfig*.json'
  - 'package.json'
  - 'package-lock.json'
  - 'bun.lockb'
documentation:
  - '*.md'
  - 'docs/**/*'
assets:
  - 'src/assets/**/*'
  - 'public/**/*'
build:
  - 'vite.config.ts'
  - 'eslint.config.js'
